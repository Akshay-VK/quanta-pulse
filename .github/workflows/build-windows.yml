
name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # This convenience build is not a release: it uploads a plain installer,
      # so it creates no updater artifact and needs no signing key. Signed,
      # updater-enabled installers are built by release.yml on a v*.*.* tag.
      - name: Build NSIS installer
        shell: bash
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Quanta-Pulse-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
