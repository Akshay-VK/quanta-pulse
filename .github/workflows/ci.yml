name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    env:
      # The date/month assertions are written against IST. Pin the runner so the
      # suite does not depend on the machine timezone (a UTC runner otherwise
      # formats in UTC and the month labels shift).
      TZ: Asia/Kolkata
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npx eslint . --max-warnings 0
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx vite build

  rust:
    name: Rust (cargo, windows)
    # Windows matches the shipped target. Building the stack on Linux would
    # need webkit2gtk/glib system packages the product does not use.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check --all-targets
        working-directory: src-tauri
      - name: Cargo test
        run: cargo test
        working-directory: src-tauri