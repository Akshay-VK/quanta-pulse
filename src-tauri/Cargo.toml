[package]
name = "quanta-pulse"
version = "0.2.0"
description = "Minimal tracker for BITS Pilani Quanta LMS"
authors = ["Quanta Pulse"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "quanta_pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.32", features = ["bundled", "backup"] }

reqwest = { version = "0.12", default-features = false, features = [
  "cookies",
  "gzip",
  "brotli",
  "rustls-tls",
  "json",
  "multipart",
] }

scraper = "0.20"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
# Mirror only: free-space floor for the low-disk pause, plus filename handling
# (RFC 5987 decoding and NFC normalisation of path segments).
fs2 = "0.4"
percent-encoding = "2"
unicode-normalization = "0.1"
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
regex = "1"
once_cell = "1"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
zip = { path = "../vendor/zip" }

[features]
# Enables the interactive SSO webview login path (macOS WebKit cookie read).
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
